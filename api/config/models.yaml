# Curated model priority list — displayed first in the UI dropdown.
# Live model discovery happens via provider /v1/models APIs (models.ts).
# Models here get nice display names and priority ordering; any model not
# here still appears if a provider's live API returns it.
#
# Priority blocks 1-2 are the SERVER-FREE providers: no user key needed at
# all (server key pools + free-tier providers that only need a free signup
# key). Paid providers (openai/anthropic) rank last — they only appear when
# the user has added their own keys.
models:
  # ── Google AI Studio — free tier, no credit card (Flashes: 1,000-1,500 RPD) ──
  - id: "gemini/gemini-3.5-flash-lite"
    provider: google
    name: "Gemini 3.5 Flash-Lite (fastest)"
    priority: 1
  - id: "gemini/gemini-3.7-flash"
    provider: google
    name: "Gemini 3.7 Flash"
    priority: 16

  # ── Groq — free forever, no credit card (~30 RPM, up to 14.4k RPD) ──
