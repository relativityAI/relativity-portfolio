server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API calls (VITE_RELATIVITY_API is empty → "/api/...").
    location /api/ {
        # Resolve at request time via Docker DNS — nginx exits at startup if
        # the api hostname isn't registered yet (depends_on races).
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://services:8080;
        # Variable proxy_pass skips prefix stripping — do it here.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # SSE streams (analysis/builder trace) break if nginx buffers them.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
