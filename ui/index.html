<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Relativity AI Portfolio</title>
  <meta name="description" content="AI-powered investment research platform. Create agents that capture your investing style and dig through filings, news, and numbers — everything cited." />

  <!-- Apply the saved/OS theme class before first paint so the page renders in
       the right color mode immediately. Mirrors next-themes (storage key
       "theme", attribute "class", default "system"); next-themes re-applies it
       on mount, so this only covers the pre-hydration window and prevents a
       flash. The site's CSS tokens are driven solely by .dark/.light on <html>,
       so this class must exist before any layout happens. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var dark =
          stored === "dark" ||
          ((!stored || stored === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>

  <!-- Favicon set -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Relativity AI Portfolio" />
  <meta property="og:description" content="AI-powered investment research platform. Create agents that capture your investing style." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:url" content="https://relativity-ai.example.com" />
  <meta property="og:site_name" content="Relativity AI" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Relativity AI Portfolio" />
  <meta name="twitter:description" content="AI-powered investment research platform." />
  <meta name="twitter:image" content="/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
