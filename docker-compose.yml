services:
  ui:
    container_name: relativity-ui
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file: ./ui/.env
    environment:
      VITE_RELATIVITY_API: http://localhost:8080

  api:
    container_name: relativity-api
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: ./api/.env
    environment:
      PORT: 8080
      SEARXNG_URL: http://searxng:8080

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      - ./api/searxng/settings.yml:/etc/searxng/settings.yml
